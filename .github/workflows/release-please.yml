# Version, changelog and tag for the site, from Conventional Commits.
#
# release-please keeps one release PR open against main. Merging it bumps
# `version` in package.json, writes CHANGELOG.md and cuts a GitHub release and
# tag. Deploying is not tied to it: every push to main already deploys
# (deploy.yml), so a release records what shipped rather than shipping it.
#
# The release PR is opened with the workflow's GITHUB_TOKEN, and GitHub does not
# start workflows for events that token causes, so the PR's required `Check` and
# `Build` jobs do not run on their own. Close and reopen the PR (or push to its
# branch) to start them before merging.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
